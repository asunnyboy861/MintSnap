name: MintSnap
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: MintSnap/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  MintSnap:
    type: application
    platform: iOS
    sources:
      - MintSnap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.MintSnap
        TARGETED_DEVICE_FAMILY: "1,2"
